version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      composer:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees: [parisek]
    commit-message:
      prefix: "chore(deps)"
    groups:
      vue-runtime:
        patterns: [vue, pinia, vue-router]
        update-types: [minor, patch]
      vite-toolchain:
        patterns: [vite, "@vitejs/plugin-vue", vitest, "@vitest/*"]
        update-types: [minor, patch]
      tailwind:
        patterns: [tailwindcss, "@tailwindcss/*"]
        update-types: [minor, patch]
