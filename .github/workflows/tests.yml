name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch / PR cancels the previous run.
# `github.workflow` and `github.ref` are sanitised by GitHub.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, yaml
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php-${{ matrix.php }}-

      - run: composer install --no-interaction --prefer-dist

      - run: vendor/bin/phpunit

  e2e:
    runs-on: ubuntu-latest
    name: e2e (Layer A — HTTP smoke)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: intl, yaml
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ runner.os }}-php-8.3-${{ hashFiles('composer.json') }}

      - run: composer install --no-interaction --prefer-dist

      # run.sh boots a `php -S` fixture server and runs the HTTP smoke (Layer A).
      # Browser-level SPA behaviour is covered by the e2e-playwright job below.
      - run: bash tests/e2e/run.sh

      # The shipped front controller, written by `front-controller:init` into a
      # CMS-style nested static directory and served by PHP's built-in server.
      - run: bash tests/e2e/front-controller.sh

  e2e-playwright:
    runs-on: ubuntu-latest
    name: e2e (Playwright)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: intl, yaml
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ runner.os }}-php-8.3-${{ hashFiles('composer.json') }}

      - run: composer install --no-interaction --prefer-dist

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run Vitest suite
        run: cd frontend && npm test

      - name: Build the SPA
        run: cd frontend && npm run build

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: cd frontend && npm run test:e2e

  dist-reproducible:
    runs-on: ubuntu-latest
    name: dist/ is reproducible from frontend/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci

      - run: cd frontend && npm run build

      - name: Fail if the rebuild differs from the committed dist/
        run: git diff --exit-code -- dist/

  npm-audit:
    runs-on: ubuntu-latest
    name: frontend dependency audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --ignore-scripts
      - name: Audit the full frontend dependency tree
        run: npm audit --prefix frontend --audit-level=low

  adr-index:
    runs-on: ubuntu-latest
    name: docs/adr/ index is in sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the ADR directory against the index
        run: python3 scripts/check-adr-index.py

  phpstan:
    runs-on: ubuntu-latest
    name: PHPStan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: intl, yaml
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ runner.os }}-php-8.3-${{ hashFiles('composer.json') }}

      - run: composer install --no-interaction --prefer-dist

      - run: php -d memory_limit=512M vendor/bin/phpstan analyse

  composer:
    name: composer hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Audit dependencies for known advisories
        run: composer audit --abandoned=report
      - name: composer.json is normalized
        run: composer normalize --dry-run

  bc-check:
    name: BC check (Roave, against the latest release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Roave reads the release tags, so it needs the whole history.
          fetch-depth: 0

      # Roave requires PHP 8.4 or newer, so it cannot be a require-dev of this
      # package (PHP ^8.3). It is installed here, outside composer.json.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: intl, yaml
          coverage: none
          tools: composer:v2

      - name: Install Roave BackwardCompatibilityCheck
        run: composer global require --no-interaction roave/backward-compatibility-check:^8.23

      # The tags are `vX.Y.Z`; Roave finds `X.Y.Z` tags by itself, so name the
      # base. The ignored lines are in .roave-backward-compatibility-check.xml.
      - name: Compare the PR with the latest release
        run: |
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          echo "Comparing with ${latest}"
          "$(composer global config bin-dir --absolute --quiet)/roave-backward-compatibility-check" \
            --from="${latest}" --format=github-actions

  cs:
    name: code style (PER-CS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer cs
