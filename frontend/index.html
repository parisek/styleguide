<!DOCTYPE html>
<html lang="cs" data-default-locale="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Styleguide</title>
    <link rel="icon" id="sg-favicon-tag" href="">
    <link rel="stylesheet" href="./styleguide.css">
    <script type="module" src="./styleguide.js"></script>
</head>
<body
    class="bg-zinc-950 text-zinc-100 font-sans antialiased"
    data-project-name=""
    data-project-favicon="">
    <div class="flex h-screen overflow-hidden">

        <!-- ============== Sidebar ============== -->
        <aside x-data="sidebar" class="w-72 bg-zinc-900 border-r border-zinc-800 flex flex-col" :class="!$store.ui.sidebarOpen && 'hidden'">
            <!-- Header -->
            <div class="p-4 border-b border-zinc-800 flex items-center gap-3">
                <img src="" alt="" class="w-8 h-8 rounded bg-zinc-50" id="sg-favicon">
                <div>
                    <div class="font-bold text-sm text-zinc-50" id="sg-project-name">Styleguide</div>
                    <div class="text-[10px] uppercase tracking-wider text-zinc-500" x-text="$store.i18n.t('nav.styleguide')"></div>
                </div>
            </div>

            <!-- Search -->
            <div x-data="search" class="p-3 border-b border-zinc-800">
                <input
                    x-ref="input"
                    x-model="$store.ui.searchQuery"
                    type="text"
                    class="w-full px-3 py-2 bg-zinc-800 border border-zinc-700 rounded text-sm placeholder-zinc-500"
                    :placeholder="$store.i18n.t('search.placeholder')">
            </div>

            <!-- Sections + items (scroll) -->
            <nav class="flex-1 overflow-y-auto p-3 space-y-2">
                <!-- Pinned sectionless routes (overview + foundations) -->
                <a href="#" @click.prevent="select('overview', null)"
                   class="flex items-center gap-2 px-2 py-1.5 text-sm rounded"
                   :class="isActive('overview', null) ? 'bg-white/10 text-white font-medium' : 'text-zinc-300 hover:bg-zinc-800 hover:text-white'">
                    <span class="w-1.5 h-1.5 rounded-full" :class="isActive('overview', null) ? 'bg-white' : 'bg-zinc-600'"></span>
                    <span x-text="$store.i18n.t('nav.overview')"></span>
                </a>
                <a href="#" @click.prevent="select('foundations', null)"
                   class="flex items-center gap-2 px-2 py-1.5 text-sm rounded mb-2"
                   :class="isActive('foundations', null) ? 'bg-white/10 text-white font-medium' : 'text-zinc-300 hover:bg-zinc-800 hover:text-white'">
                    <span class="w-1.5 h-1.5 rounded-full" :class="isActive('foundations', null) ? 'bg-white' : 'bg-zinc-600'"></span>
                    <span x-text="$store.i18n.t('nav.foundations')"></span>
                </a>

                <template x-for="section in ['basic', 'blocks', 'gutenberg']" :key="section">
                    <!-- Hide entire section when search yields zero matches so the
                         sidebar collapses to just what's relevant. -->
                    <div x-show="filterItems($store.components.bySection(section)).length > 0">
                        <button @click="toggleSection(section)" class="w-full flex justify-between items-center px-2 py-1.5 text-[10px] uppercase tracking-wider font-bold text-zinc-500 hover:text-zinc-300">
                            <span x-text="$store.i18n.t(`sections.${section}`)"></span>
                            <span class="text-zinc-600" x-text="filterItems($store.components.bySection(section)).length"></span>
                        </button>
                        <!-- Force-open the section when a search is active so the
                             match is visible without an extra click; otherwise
                             respect the persisted collapsed/expanded state. -->
                        <ul x-show="sections[section] || $store.ui.searchQuery" class="mt-1 space-y-0.5">
                            <template x-for="item in filterItems($store.components.bySection(section))" :key="item.id">
                                <li>
                                    <a href="#" @click.prevent="select('component', item.id)"
                                       class="flex items-center gap-2 px-2 py-1.5 text-sm rounded"
                                       :class="isActive('component', item.id) ? 'bg-white/10 text-white font-medium' : 'text-zinc-400 hover:bg-zinc-800 hover:text-white'">
                                        <span class="w-1.5 h-1.5 rounded-full" :class="isActive('component', item.id) ? 'bg-white' : 'bg-zinc-600'"></span>
                                        <span x-text="item.name ?? item.id"></span>
                                    </a>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>

                <!-- Pages -->
                <div x-show="filterItems($store.components.pages).length > 0">
                    <button @click="toggleSection('pages')" class="w-full flex justify-between items-center px-2 py-1.5 text-[10px] uppercase tracking-wider font-bold text-zinc-500 hover:text-zinc-300">
                        <span x-text="$store.i18n.t('sections.pages')"></span>
                        <span class="text-zinc-600" x-text="filterItems($store.components.pages).length"></span>
                    </button>
                    <ul x-show="sections.pages || $store.ui.searchQuery" class="mt-1 space-y-0.5">
                        <template x-for="page in filterItems($store.components.pages)" :key="page.id">
                            <li>
                                <a href="#" @click.prevent="select('page', page.id)"
                                   class="flex items-center gap-2 px-2 py-1.5 text-sm rounded"
                                   :class="isActive('page', page.id) ? 'bg-white/10 text-white font-medium' : 'text-zinc-400 hover:bg-zinc-800 hover:text-white'">
                                    <span class="w-1.5 h-1.5 rounded-full" :class="isActive('page', page.id) ? 'bg-white' : 'bg-zinc-600'"></span>
                                    <span x-text="page.name ?? page.id"></span>
                                </a>
                            </li>
                        </template>
                    </ul>
                </div>
            </nav>

            <!-- Language switcher footer -->
            <div x-data="languageSwitcher" class="border-t border-zinc-800 px-4 py-2 flex justify-end gap-1 text-xs font-mono">
                <template x-for="(loc, idx) in supported" :key="loc">
                    <span>
                        <span x-show="idx > 0" class="text-zinc-600">·</span>
                        <button @click="setLocale(loc)"
                                :class="isActive(loc) ? 'text-zinc-50 font-semibold' : 'text-zinc-500 hover:text-zinc-300'"
                                x-text="loc"></button>
                    </span>
                </template>
            </div>
        </aside>

        <!-- ============== Main ============== -->
        <main x-data="preview" class="flex-1 flex flex-col bg-zinc-950 select-none" :class="isDragging && 'cursor-ew-resize'">
            <!-- Toolbar -->
            <div class="flex justify-between items-center px-4 py-2.5 bg-zinc-900 border-b border-zinc-800">
                <div class="flex items-center gap-3 min-w-0">
                    <button @click="$store.ui.toggleSidebar()" class="text-zinc-400 hover:text-zinc-100 shrink-0" :title="$store.i18n.t('toolbar.toggle_sidebar')">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <template x-if="$store.ui.route.type === 'overview'">
                        <span class="font-semibold text-zinc-100" x-text="$store.i18n.t('nav.overview')"></span>
                    </template>
                    <template x-if="$store.ui.route.type === 'foundations'">
                        <span class="font-semibold text-zinc-100" x-text="$store.i18n.t('nav.foundations')"></span>
                    </template>
                    <template x-if="$store.ui.route.slug">
                        <div class="flex items-center gap-2 min-w-0">
                            <span class="text-[10px] uppercase tracking-wider font-bold bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded shrink-0"
                                  x-text="$store.ui.route.type === 'page' ? $store.i18n.t('toolbar.type_page') : $store.i18n.t('toolbar.type_component')"></span>
                            <!-- Breadcrumb: Section / Component name (slug). The section
                                 segment hides while the components API is still loading
                                 so the toolbar doesn't flash a translated label like
                                 `(undefined)` before data arrives. -->
                            <nav class="flex items-center gap-1.5 min-w-0 text-sm">
                                <template x-if="currentSectionKey">
                                    <span class="text-zinc-500 shrink-0" x-text="$store.i18n.t(`sections.${currentSectionKey}`)"></span>
                                </template>
                                <template x-if="currentSectionKey">
                                    <span class="text-zinc-600 shrink-0">/</span>
                                </template>
                                <span class="font-semibold text-zinc-100 truncate" x-text="currentItemName"></span>
                                <span class="text-zinc-500 font-mono text-xs shrink-0" x-text="`(${$store.ui.route.slug})`"></span>
                            </nav>
                        </div>
                    </template>
                    <template x-if="!$store.ui.route.slug && $store.ui.route.type !== 'foundations' && $store.ui.route.type !== 'overview'">
                        <span class="text-zinc-500 text-sm" x-text="$store.i18n.t('toolbar.select_prompt')"></span>
                    </template>
                </div>

                <!-- Viewport controls — Tailwind-aligned segmented control with explicit
                     pixel labels + Custom number input + Full. Hidden on the foundations
                     route where responsive testing doesn't make sense (foundations shows
                     palette / typography / project surface; locking it to 100% width
                     keeps the layout stable across reloads). -->
                <template x-if="iframeSrc && $store.ui.route.type !== 'foundations' && $store.ui.route.type !== 'overview'">
                    <div class="flex items-center gap-3 shrink-0">
                        <span class="font-mono text-xs text-zinc-500 tabular-nums hidden sm:inline" x-text="`${currentWidth} px`"></span>
                        <div class="flex gap-px rounded overflow-hidden bg-zinc-800">
                            <template x-for="vp in viewports" :key="vp.key">
                                <button @click="setPreset(vp.key)"
                                        :title="vp.width ? `${vp.label} — ${vp.width} × ${vp.height} px` : `${vp.label} — 100%`"
                                        class="px-2.5 h-7 flex items-center justify-center text-xs font-medium tabular-nums transition-colors"
                                        :class="activePreset === vp.key ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-400 hover:text-zinc-100 hover:bg-zinc-700'">
                                    <!-- Width number as label for the px-bearing presets;
                                         "Full" label for the 100% preset. -->
                                    <span x-text="vp.width ?? vp.label"></span>
                                </button>
                            </template>
                            <!-- Custom input — always visible. Typing then Enter / blur
                                 applies the value (validated 100..4000 px). When the
                                 store width matches a preset, the input still shows the
                                 current pixel value so it's a readout + override knob
                                 in one. activePreset === 'custom' flips the styling to
                                 the selected state. -->
                            <input type="number"
                                   x-model.number="customWidthInput"
                                   @keydown.enter.prevent="applyCustomWidth(); $event.target.blur()"
                                   @blur="applyCustomWidth"
                                   :min="100" :max="4000"
                                   :placeholder="$store.i18n.t('toolbar.custom_width_placeholder')"
                                   :aria-label="$store.i18n.t('toolbar.custom_width')"
                                   :title="$store.i18n.t('toolbar.custom_width')"
                                   class="w-20 px-2 h-7 text-xs font-mono tabular-nums border-l border-zinc-700 focus:outline-none focus:ring-1 focus:ring-zinc-400 transition-colors"
                                   :class="activePreset === 'custom' ? 'bg-zinc-100 text-zinc-900 placeholder-zinc-500' : 'bg-zinc-800 text-zinc-400 placeholder-zinc-500 hover:bg-zinc-700 hover:text-zinc-100'">
                        </div>
                        <!-- Open the raw render endpoint in a new tab — the iframe HTML reveals
                             its own "back to styleguide" navbar at the top when standalone. -->
                        <a :href="iframeSrc" target="_blank" rel="noopener"
                           :title="$store.i18n.t('toolbar.open_in_new_tab')"
                           class="h-7 w-7 flex items-center justify-center rounded text-zinc-400 hover:text-zinc-100 hover:bg-zinc-700 transition-colors">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 4h6v6M20 4l-9 9M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/>
                            </svg>
                        </a>
                    </div>
                </template>
                <!-- Foundations route still gets the open-in-new-tab affordance, just
                     without the viewport controls. -->
                <template x-if="iframeSrc && $store.ui.route.type === 'foundations'">
                    <a :href="iframeSrc" target="_blank" rel="noopener"
                       :title="$store.i18n.t('toolbar.open_in_new_tab')"
                       class="h-7 w-7 flex items-center justify-center rounded text-zinc-400 hover:text-zinc-100 hover:bg-zinc-700 transition-colors shrink-0">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 4h6v6M20 4l-9 9M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/>
                        </svg>
                    </a>
                </template>
            </div>

            <!-- Usage cross-reference panel — what this component is used in, or which components a page uses -->
            <div x-data="usagePanel" x-show="visible && items.length" class="px-4 py-2 bg-zinc-900/60 border-b border-zinc-800 flex items-center gap-2 flex-wrap text-xs">
                <span class="uppercase tracking-wider font-semibold text-zinc-500 shrink-0" x-text="label"></span>
                <template x-for="item in items" :key="`${item.type}:${item.id}`">
                    <button @click="select(item)"
                            :disabled="!item.type"
                            :title="item.type ? `${item.type}/${item.id}` : item.id"
                            class="px-2 py-0.5 rounded font-mono transition-colors"
                            :class="item.type
                                ? (item.type === 'page'
                                    ? 'bg-indigo-500/10 text-indigo-300 hover:bg-indigo-500/20'
                                    : 'bg-zinc-800 text-zinc-300 hover:bg-zinc-700 hover:text-white')
                                : 'bg-zinc-800/40 text-zinc-600 cursor-not-allowed line-through'">
                        <span x-text="item.name"></span>
                    </button>
                </template>
            </div>

            <!-- External-link bar — Asana / Figma / Drupal / Web icons fed from
                 the current component's parsed metadata (`asana:`, `figma:`,
                 `drupal:`, `web:` keys in the .twig YAML comment). Hidden when
                 no links are declared. -->
            <div x-data="linkBar" x-show="visible && links.length" class="px-4 py-2 bg-zinc-900/40 border-b border-zinc-800 flex items-center gap-2 flex-wrap text-xs">
                <template x-for="link in links" :key="link.key">
                    <a :href="link.url" target="_blank" rel="noopener"
                       :title="`${link.label} — ${link.url}`"
                       class="inline-flex items-center gap-1.5 px-2 py-1 rounded bg-zinc-800/60 text-zinc-300 hover:bg-zinc-700 hover:text-white transition-colors">
                        <template x-if="link.key === 'asana'">
                            <svg class="w-3.5 h-3.5 text-rose-400" viewBox="0 0 24 24" fill="currentColor"><path d="M18.78 12.653c-2.478 0-4.487 2.009-4.487 4.487 0 2.478 2.009 4.487 4.487 4.487 2.478 0 4.487-2.009 4.487-4.487 0-2.478-2.009-4.487-4.487-4.487zm-13.56 0c-2.478 0-4.487 2.009-4.487 4.487 0 2.478 2.009 4.487 4.487 4.487 2.478 0 4.487-2.009 4.487-4.487 0-2.478-2.009-4.487-4.487-4.487zm11.267-5.14c0 2.478-2.009 4.487-4.487 4.487-2.478 0-4.487-2.009-4.487-4.487 0-2.478 2.009-4.487 4.487-4.487 2.478 0 4.487 2.009 4.487 4.487"/></svg>
                        </template>
                        <template x-if="link.key === 'figma'">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 15 22" fill="none"><path d="M7.5 11a3.75 3.75 0 1 1 7.5 0 3.75 3.75 0 0 1-7.5 0z" fill="#1ABCFE"/><path d="M0 18.25a3.75 3.75 0 0 1 3.75-3.75H7.5V22a3.75 3.75 0 1 1-7.5 0v-3.75z" fill="#0ACF83"/><path d="M7.5 0v7.5h3.75a3.75 3.75 0 1 0 0-7.5H7.5z" fill="#FF7262"/><path d="M0 3.75A3.75 3.75 0 0 0 3.75 7.5H7.5V0H3.75A3.75 3.75 0 0 0 0 3.75z" fill="#F24E1E"/><path d="M0 11a3.75 3.75 0 0 0 3.75 3.75H7.5V7.5H3.75A3.75 3.75 0 0 0 0 11z" fill="#A259FF"/></svg>
                        </template>
                        <template x-if="link.key === 'drupal'">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="#0678be"><path d="M12 0C10.736 3.256 8.928 4.976 6.624 7.28 3.456 10.448 2 13.12 2 16.064 2 20.448 6.464 24 12 24s10-3.552 10-7.936c0-2.944-1.456-5.616-4.624-8.784C15.072 4.976 13.264 3.256 12 0z"/></svg>
                        </template>
                        <template x-if="link.key === 'web'">
                            <svg class="w-3.5 h-3.5 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                        </template>
                        <span x-text="link.label"></span>
                    </a>
                </template>
            </div>

            <!-- Preview area (iframe + empty/loading states) — hidden on the
                 overview route, which renders its own light-themed SPA view
                 in the sibling template below. -->
            <template x-if="$store.ui.route.type !== 'overview'">
            <div class="flex-1 flex justify-center items-start p-6 bg-zinc-950 overflow-auto">
                <template x-if="iframeSrc">
                    <div x-ref="iframeWrapper"
                         :style="`width: ${$store.ui.route.type === 'foundations' ? '100%' : previewWidth}; max-width: 100%`"
                         :class="isDragging ? '' : 'transition-[width] duration-200 ease-out'"
                         class="relative bg-white rounded shadow-lg">
                        <iframe :src="iframeSrc" @load="onIframeLoad"
                                class="w-full h-[calc(100vh-120px)] rounded border-0"
                                :class="{ 'pointer-events-none': isDragging }"></iframe>
                        <!-- Solid overlay during navigation — the iframe keeps showing the old
                             slug's content until the browser finishes parsing the new src. The
                             overlay sits ON TOP of the iframe so the user never sees the stale
                             content. No enter transition: the old slug's body must be obscured
                             instantly when navigation starts. The loading dot itself fades in
                             with a 120ms delay so very fast loads (<120ms — common for cached
                             responses) skip the dot entirely. -->
                        <div x-show="isLoading"
                             class="absolute inset-0 flex items-center justify-center rounded bg-white pointer-events-none">
                            <div x-show="isLoading"
                                 x-transition.opacity.duration.150ms.delay.120ms
                                 class="w-2 h-2 rounded-full bg-zinc-300 animate-pulse"></div>
                        </div>
                        <!-- Drag handles: outside the iframe so cursor events aren't swallowed;
                             rendered on both edges for centered-grow symmetry. Hidden on the
                             foundations route — that view has no responsivity worth testing, and
                             the locked-100% iframe shouldn't be draggable. -->
                        <template x-if="$store.ui.route.type !== 'foundations' && $store.ui.route.type !== 'overview'">
                            <div @mousedown="startDrag" @touchstart="startDrag"
                                 class="absolute -right-2 top-0 bottom-0 w-4 flex items-center justify-center cursor-ew-resize group">
                                <div class="w-1 h-12 rounded-full bg-zinc-600 group-hover:bg-zinc-300 transition-colors"
                                     :class="isDragging && 'bg-zinc-200'"></div>
                            </div>
                        </template>
                        <template x-if="$store.ui.route.type !== 'foundations' && $store.ui.route.type !== 'overview'">
                            <div @mousedown="startDrag" @touchstart="startDrag"
                                 class="absolute -left-2 top-0 bottom-0 w-4 flex items-center justify-center cursor-ew-resize group">
                                <div class="w-1 h-12 rounded-full bg-zinc-600 group-hover:bg-zinc-300 transition-colors"
                                     :class="isDragging && 'bg-zinc-200'"></div>
                            </div>
                        </template>
                    </div>
                </template>
                <template x-if="!iframeSrc && !$store.components.loading">
                    <p class="text-zinc-500 mt-20" x-text="$store.i18n.t('empty_state')"></p>
                </template>
                <template x-if="$store.components.loading">
                    <p class="text-zinc-500 mt-20" x-text="$store.i18n.t('loading')"></p>
                </template>
            </div>
            </template>

            <!-- Components & Pages index — SPA-rendered (no iframe) so the
                 visual chrome ships with the package and is identical across
                 consuming projects regardless of their own CSS. -->
            <template x-if="$store.ui.route.type === 'overview'">
                <div x-data="overview" class="flex-1 overflow-y-auto bg-zinc-50 text-zinc-900">
                    <div class="max-w-6xl mx-auto px-4 py-8 md:px-6 md:py-10 lg:px-8">
                        <header class="mb-8">
                            <h1 class="font-bold text-2xl sm:text-3xl lg:text-4xl tracking-tight" x-text="$store.i18n.t('overview.title')"></h1>
                            <p class="mt-2 max-w-3xl text-base text-zinc-600 leading-relaxed" x-text="$store.i18n.t('overview.subtitle')"></p>
                            <label class="mt-4 inline-flex items-center gap-2 text-sm text-zinc-700 cursor-pointer select-none">
                                <input type="checkbox" x-model="showUsage" class="rounded border-zinc-300 text-zinc-900 focus:ring-zinc-900">
                                <span x-text="$store.i18n.t('overview.show_usage')"></span>
                            </label>
                        </header>

                        <!-- Pages block -->
                        <section x-show="pages.length > 0" class="mb-10">
                            <h2 class="flex items-center gap-2 mb-4 font-semibold text-lg text-zinc-900">
                                <span x-text="$store.i18n.t('overview.pages')"></span>
                                <span class="inline-flex items-center justify-center min-w-6 h-6 px-2 rounded-full bg-zinc-200 text-xs font-mono text-zinc-700" x-text="pages.length"></span>
                            </h2>
                            <ul class="divide-y divide-zinc-200 border border-zinc-200 rounded-xl bg-white shadow-sm">
                                <template x-for="page in pages" :key="page.id">
                                    <li class="p-4">
                                        <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
                                            <a href="#" @click.prevent="select({ id: page.id, type: 'page' })" class="font-medium text-zinc-900 hover:text-zinc-600" x-text="page.name ?? page.id"></a>
                                            <code class="text-xs font-mono text-zinc-500" x-text="page.id"></code>
                                        </div>
                                        <template x-if="showUsage && forwardUsage(page).length > 0">
                                            <div class="mt-2 flex flex-wrap gap-1.5">
                                                <template x-for="chip in forwardUsage(page)" :key="chip.id">
                                                    <button type="button" @click="select(chip)" :class="chip.type ? 'bg-zinc-100 hover:bg-zinc-200 text-zinc-700 cursor-pointer' : 'bg-zinc-50 text-zinc-400 cursor-default'" class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium" x-text="chip.name"></button>
                                                </template>
                                            </div>
                                        </template>
                                    </li>
                                </template>
                            </ul>
                        </section>

                        <!-- Components, grouped by sidebar section -->
                        <template x-for="block in componentSections" :key="block.section">
                            <section class="mb-10">
                                <h2 class="flex items-center gap-2 mb-4 font-semibold text-lg text-zinc-900">
                                    <span x-text="$store.i18n.t(`sections.${block.section}`)"></span>
                                    <span class="inline-flex items-center justify-center min-w-6 h-6 px-2 rounded-full bg-zinc-200 text-xs font-mono text-zinc-700" x-text="block.items.length"></span>
                                </h2>
                                <ul class="divide-y divide-zinc-200 border border-zinc-200 rounded-xl bg-white shadow-sm">
                                    <template x-for="item in block.items" :key="item.id">
                                        <li class="p-4">
                                            <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
                                                <a href="#" @click.prevent="select({ id: item.id, type: 'component' })" class="font-medium text-zinc-900 hover:text-zinc-600" x-text="item.name ?? item.id"></a>
                                                <code class="text-xs font-mono text-zinc-500" x-text="item.id"></code>
                                            </div>
                                            <template x-if="showUsage">
                                                <div class="mt-2 flex flex-wrap gap-1.5">
                                                    <template x-if="reverseUsage(item.id).length === 0">
                                                        <span class="text-xs text-zinc-400 italic" x-text="$store.i18n.t('overview.no_usage')"></span>
                                                    </template>
                                                    <template x-for="chip in reverseUsage(item.id)" :key="chip.id">
                                                        <button type="button" @click="select(chip)" class="inline-flex items-center px-2 py-0.5 rounded-md bg-zinc-100 hover:bg-zinc-200 text-xs font-medium text-zinc-700 cursor-pointer" x-text="chip.name"></button>
                                                    </template>
                                                </div>
                                            </template>
                                        </li>
                                    </template>
                                </ul>
                            </section>
                        </template>

                        <!-- Compact directory grid -->
                        <section class="mt-12 pt-8 border-t border-zinc-200">
                            <h2 class="mb-4 font-semibold text-sm uppercase tracking-wider text-zinc-500" x-text="$store.i18n.t('overview.directory')"></h2>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                <template x-for="section in ['basic', 'blocks', 'gutenberg', 'pages']" :key="section">
                                    <div x-show="directoryList(section).length > 0">
                                        <h3 class="mb-2 font-semibold text-xs uppercase tracking-wider text-zinc-700" x-text="$store.i18n.t(`sections.${section}`)"></h3>
                                        <ul class="space-y-1">
                                            <template x-for="item in directoryList(section)" :key="item.id">
                                                <li>
                                                    <a href="#" @click.prevent="select({ id: item.id, type: section === 'pages' ? 'page' : 'component' })" class="text-sm text-zinc-600 hover:text-zinc-900" x-text="item.name ?? item.id"></a>
                                                </li>
                                            </template>
                                        </ul>
                                    </div>
                                </template>
                            </div>
                        </section>
                    </div>
                </div>
            </template>
        </main>
    </div>
</body>
</html>
