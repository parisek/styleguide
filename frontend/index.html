<!DOCTYPE html>
<html lang="cs" data-default-locale="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Styleguide</title>
    <link rel="icon" id="sg-favicon-tag" href="">
    <!--
        Synchronous FOUC-prevention: apply `.dark` on <html> BEFORE the
        stylesheet loads so a dark-mode reload doesn't flash light. Reads
        the same localStorage key @alpinejs/persist writes for the theme
        store (bare `sg-theme` name from `.as('sg-theme')` — current
        @alpinejs/persist does NOT prefix keys, despite the legacy `_x_`
        convention some older write-ups still mention). The value is
        JSON-encoded, hence the parse.
        Falls back to `prefers-color-scheme` when nothing is persisted yet.
        Wrapped in try/catch because Safari private mode throws on
        localStorage access.
    -->
    <script>
        (function () {
            // Narrow try/catch to the localStorage read alone — Safari private
            // mode throws on `localStorage.getItem`. The matchMedia fallback
            // for `system` mode lives outside the catch so a localStorage
            // throw doesn't strand OS-dark users on a light flash.
            var mode = 'system';
            try {
                var stored = localStorage.getItem('sg-theme');
                if (stored) mode = JSON.parse(stored);
            } catch (e) {}
            var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (dark) document.documentElement.classList.add('dark');
        })();
    </script>
    <link rel="stylesheet" href="./styleguide.css">
    <script type="module" src="./styleguide.js"></script>
</head>
<body
    class="bg-white text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 font-sans antialiased"
    data-project-name=""
    data-project-favicon="">
    <div class="flex h-screen overflow-hidden">

        <!-- ============== Sidebar ============== -->
        <aside x-data="sidebar" class="w-72 bg-zinc-50 border-r border-zinc-200 dark:bg-zinc-900 dark:border-zinc-800 flex flex-col" :class="!$store.ui.sidebarOpen && 'hidden'">
            <!-- Header -->
            <div class="p-4 border-b border-zinc-200 dark:border-zinc-800 flex items-center gap-3">
                <img src="" alt="" class="w-8 h-8 rounded bg-zinc-200 dark:bg-zinc-50" id="sg-favicon">
                <div class="min-w-0 flex-1">
                    <div class="font-bold text-sm text-zinc-900 dark:text-zinc-50 truncate" id="sg-project-name">Styleguide</div>
                    <div class="text-[10px] uppercase tracking-wider text-zinc-500" x-text="$store.i18n.t('nav.styleguide')"></div>
                </div>
                <!-- Theme toggle: cycles light → dark → system → light. The
                     icon swap follows the *chosen* mode (not the resolved
                     theme) so the user sees which mode they're in, including
                     the `system` state which renders the monitor glyph. -->
                <button @click="$store.theme.cycle()"
                        :title="`${$store.i18n.t('theme.' + $store.theme.mode)} — ${$store.i18n.t('theme.toggle')}`"
                        :aria-label="$store.i18n.t('theme.toggle')"
                        class="shrink-0 w-8 h-8 flex items-center justify-center rounded text-zinc-600 hover:text-zinc-900 hover:bg-zinc-200 dark:text-zinc-400 dark:hover:text-zinc-100 dark:hover:bg-zinc-800 transition-colors">
                    <template x-if="$store.theme.mode === 'light'">
                        <svg aria-hidden="true" focusable="false" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 2a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 0110 2zM10 15a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 0110 15zM10 7a3 3 0 100 6 3 3 0 000-6zM15.657 5.404a.75.75 0 10-1.06-1.06l-1.061 1.06a.75.75 0 001.06 1.06l1.06-1.06zM6.464 14.596a.75.75 0 10-1.06-1.06l-1.06 1.06a.75.75 0 001.06 1.06l1.06-1.06zM18 10a.75.75 0 01-.75.75h-1.5a.75.75 0 010-1.5h1.5A.75.75 0 0118 10zM5 10a.75.75 0 01-.75.75h-1.5a.75.75 0 010-1.5h1.5A.75.75 0 015 10zM14.596 15.657a.75.75 0 001.06-1.06l-1.06-1.061a.75.75 0 10-1.06 1.06l1.06 1.06zM5.404 6.464a.75.75 0 001.06-1.06l-1.06-1.06a.75.75 0 10-1.061 1.06l1.06 1.06z" clip-rule="evenodd"/>
                        </svg>
                    </template>
                    <template x-if="$store.theme.mode === 'dark'">
                        <svg aria-hidden="true" focusable="false" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M7.455 2.004a.75.75 0 01.26.77 7 7 0 009.958 7.967.75.75 0 011.067.853A8.5 8.5 0 116.647 1.921a.75.75 0 01.808.083z" clip-rule="evenodd"/>
                        </svg>
                    </template>
                    <template x-if="$store.theme.mode === 'system'">
                        <svg aria-hidden="true" focusable="false" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M2 4.25A2.25 2.25 0 014.25 2h11.5A2.25 2.25 0 0118 4.25v8.5A2.25 2.25 0 0115.75 15h-3.105a3.501 3.501 0 001.1 1.677A.75.75 0 0113.26 18H6.74a.75.75 0 01-.484-1.323A3.501 3.501 0 007.355 15H4.25A2.25 2.25 0 012 12.75v-8.5zm1.5 0a.75.75 0 01.75-.75h11.5a.75.75 0 01.75.75v7.5a.75.75 0 01-.75.75H4.25a.75.75 0 01-.75-.75v-7.5z" clip-rule="evenodd"/>
                        </svg>
                    </template>
                </button>
            </div>

            <!-- Search -->
            <div x-data="search" class="p-3 border-b border-zinc-200 dark:border-zinc-800">
                <input
                    x-ref="input"
                    x-model="$store.ui.searchQuery"
                    type="text"
                    class="w-full px-3 py-2 bg-white border border-zinc-300 dark:bg-zinc-800 dark:border-zinc-700 rounded text-sm placeholder-zinc-500"
                    :placeholder="$store.i18n.t('search.placeholder')">
            </div>

            <!-- Sections + items (scroll) -->
            <nav class="flex-1 overflow-y-auto p-3 space-y-2">
                <!-- Pinned sectionless routes (overview + foundations + fields) -->
                <a href="#" @click.prevent="select('overview', null)"
                   class="flex items-center gap-2 px-2 py-1.5 text-sm rounded"
                   :class="isActive('overview', null) ? 'bg-zinc-900/10 text-zinc-900 dark:bg-white/10 dark:text-white font-medium' : 'text-zinc-700 hover:bg-zinc-200 hover:text-zinc-900 dark:text-zinc-300 dark:hover:bg-zinc-800 dark:hover:text-white'">
                    <span class="w-1.5 h-1.5 rounded-full" :class="isActive('overview', null) ? 'bg-zinc-900 dark:bg-white' : 'bg-zinc-400 dark:bg-zinc-600'"></span>
                    <span x-text="$store.i18n.t('nav.overview')"></span>
                </a>
                <a href="#" @click.prevent="select('foundations', null)"
                   class="flex items-center gap-2 px-2 py-1.5 text-sm rounded"
                   :class="isActive('foundations', null) ? 'bg-zinc-900/10 text-zinc-900 dark:bg-white/10 dark:text-white font-medium' : 'text-zinc-700 hover:bg-zinc-200 hover:text-zinc-900 dark:text-zinc-300 dark:hover:bg-zinc-800 dark:hover:text-white'">
                    <span class="w-1.5 h-1.5 rounded-full" :class="isActive('foundations', null) ? 'bg-zinc-900 dark:bg-white' : 'bg-zinc-400 dark:bg-zinc-600'"></span>
                    <span x-text="$store.i18n.t('nav.foundations')"></span>
                </a>

                <template x-for="section in ['basic', 'blocks', 'gutenberg']" :key="section">
                    <!-- Hide entire section when search yields zero matches so the
                         sidebar collapses to just what's relevant. -->
                    <div x-show="filterItems($store.components.bySection(section)).length > 0">
                        <button @click="toggleSection(section)" class="w-full flex justify-between items-center px-2 py-1.5 text-[10px] uppercase tracking-wider font-bold text-zinc-500 hover:text-zinc-700 dark:hover:text-zinc-300">
                            <span x-text="$store.i18n.t(`sections.${section}`)"></span>
                            <span class="text-zinc-400 dark:text-zinc-600" x-text="filterItems($store.components.bySection(section)).length"></span>
                        </button>
                        <!-- Force-open the section when a search is active so the
                             match is visible without an extra click; otherwise
                             respect the persisted collapsed/expanded state. -->
                        <ul x-show="sections[section] || $store.ui.searchQuery" class="mt-1 space-y-0.5">
                            <template x-for="item in filterItems($store.components.bySection(section))" :key="item.id">
                                <li>
                                    <a href="#" @click.prevent="select('component', item.id)"
                                       class="flex items-center gap-2 px-2 py-1.5 text-sm rounded"
                                       :class="isActive('component', item.id) ? 'bg-zinc-900/10 text-zinc-900 dark:bg-white/10 dark:text-white font-medium' : 'text-zinc-600 hover:bg-zinc-200 hover:text-zinc-900 dark:text-zinc-400 dark:hover:bg-zinc-800 dark:hover:text-white'">
                                        <span class="w-1.5 h-1.5 rounded-full" :class="isActive('component', item.id) ? 'bg-zinc-900 dark:bg-white' : 'bg-zinc-400 dark:bg-zinc-600'"></span>
                                        <span x-text="item.name ?? item.id"></span>
                                    </a>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>

                <!-- Pages -->
                <div x-show="filterItems($store.components.pages).length > 0">
                    <button @click="toggleSection('pages')" class="w-full flex justify-between items-center px-2 py-1.5 text-[10px] uppercase tracking-wider font-bold text-zinc-500 hover:text-zinc-700 dark:hover:text-zinc-300">
                        <span x-text="$store.i18n.t('sections.pages')"></span>
                        <span class="text-zinc-400 dark:text-zinc-600" x-text="filterItems($store.components.pages).length"></span>
                    </button>
                    <ul x-show="sections.pages || $store.ui.searchQuery" class="mt-1 space-y-0.5">
                        <template x-for="page in filterItems($store.components.pages)" :key="page.id">
                            <li>
                                <a href="#" @click.prevent="select('page', page.id)"
                                   class="flex items-center gap-2 px-2 py-1.5 text-sm rounded"
                                   :class="isActive('page', page.id) ? 'bg-zinc-900/10 text-zinc-900 dark:bg-white/10 dark:text-white font-medium' : 'text-zinc-600 hover:bg-zinc-200 hover:text-zinc-900 dark:text-zinc-400 dark:hover:bg-zinc-800 dark:hover:text-white'">
                                    <span class="w-1.5 h-1.5 rounded-full" :class="isActive('page', page.id) ? 'bg-zinc-900 dark:bg-white' : 'bg-zinc-400 dark:bg-zinc-600'"></span>
                                    <span x-text="page.name ?? page.id"></span>
                                </a>
                            </li>
                        </template>
                    </ul>
                </div>
            </nav>

            <!-- Sidebar footer: Porta credit (left) + language switcher (right). Same baseline,
                 single row, so locale switching never shifts vertical layout. -->
            <div class="border-t border-zinc-200 dark:border-zinc-800 px-4 py-2 flex justify-between items-center gap-3 text-xs">
                <a href="https://portadesign.cz/?utm_source=parisek-styleguide&utm_medium=sidebar&utm_campaign=made-by"
                   target="_blank"
                   rel="noopener"
                   class="flex items-center gap-1.5 text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 transition-colors"
                   title="Made by Porta Design">
                    <!-- Inline PORTA wordmark — vendored from tailwind-base/static/images/icons/ico-porta.svg
                         so the chrome carries the maker brand without depending on consumer assets. -->
                    <svg aria-label="Porta Design" role="img" class="h-3 w-auto" viewBox="0.143 0.667 39.714 8.665" xmlns="http://www.w3.org/2000/svg">
                        <path fill="currentColor" d="M4.773,3.828c0,0.708-0.431,1.063-1.294,1.063H2.406V2.731h1.062c0.871,0,1.306,0.358,1.306,1.073V3.828z M6.116,1.589 C5.509,1.082,4.684,0.83,3.643,0.83h-3.5v8.166h2.263V6.663h1.12c1.051,0,1.89-0.249,2.52-0.748 c0.661-0.527,0.993-1.259,0.993-2.191V3.7C7.038,2.806,6.73,2.103,6.116,1.589 M14.01,4.937c0,0.606-0.19,1.116-0.572,1.528 c-0.396,0.435-0.898,0.654-1.504,0.654c-0.607,0-1.108-0.224-1.505-0.666c-0.389-0.42-0.583-0.934-0.583-1.54V4.891 c0-0.607,0.19-1.117,0.57-1.528c0.389-0.437,0.887-0.655,1.493-0.655c0.608,0,1.113,0.223,1.518,0.667 c0.389,0.419,0.583,0.933,0.583,1.539V4.937z M15.071,1.904c-0.84-0.824-1.886-1.237-3.137-1.237c-1.253,0-2.303,0.415-3.15,1.248 c-0.841,0.816-1.26,1.815-1.26,2.998v0.023c0,1.183,0.417,2.177,1.248,2.986c0.841,0.824,1.887,1.236,3.138,1.236 c1.253,0,2.303-0.416,3.15-1.248c0.839-0.816,1.26-1.815,1.26-2.998V4.891C16.32,3.708,15.903,2.712,15.071,1.904 M31.796,0.83 h-7.163v1.983h2.449v6.183h2.264V2.813h2.45V0.83z M34.352,5.777l0.923-2.323l0.908,2.323H34.352z M36.382,0.771h-2.183 l-3.476,8.225h2.379l0.584-1.459h3.15l0.595,1.459h2.426L36.382,0.771z M19.266,2.791h1.483c0.816,0,1.225,0.322,1.225,0.967v0.023 c0,0.646-0.405,0.969-1.214,0.969h-1.494V2.791z M22.854,6.152l-0.075-0.101c0.979-0.487,1.469-1.291,1.469-2.411V3.618 c0-0.801-0.24-1.436-0.723-1.901c-0.576-0.591-1.462-0.887-2.66-0.887h-3.861v8.166h2.262V6.522h1.176l0.083,0.122 c0.874,1.285,1.782,2.38,3.649,2.688l0.72-1.709C23.874,7.233,23.319,6.784,22.854,6.152"/>
                    </svg>
                    <!-- Heart icon — pulses via .sg-heartbeat keyframe (styleguide.css). Solid fill,
                         text-red-500 so dark-mode contrast stays high. aria-hidden because the
                         parent <a> already carries the human-readable label. -->
                    <svg aria-hidden="true" class="sg-heartbeat h-3 w-3 text-red-500" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 21s-7.2-4.35-9.6-9.6C.93 7.95 3.45 4.5 7.05 4.5c1.95 0 3.6.9 4.95 2.4 1.35-1.5 3-2.4 4.95-2.4 3.6 0 6.12 3.45 4.65 6.9C19.2 16.65 12 21 12 21z"/>
                    </svg>
                </a>
                <div x-data="languageSwitcher" class="flex gap-1 font-mono">
                    <template x-for="(loc, idx) in supported" :key="loc">
                        <span>
                            <span x-show="idx > 0" class="text-zinc-400 dark:text-zinc-600">·</span>
                            <button @click="setLocale(loc)"
                                    :class="isActive(loc) ? 'text-zinc-900 dark:text-zinc-50 font-semibold' : 'text-zinc-500 hover:text-zinc-700 dark:hover:text-zinc-300'"
                                    x-text="loc"></button>
                        </span>
                    </template>
                </div>
            </div>
        </aside>

        <!-- ============== Main ============== -->
        <!-- `select-none` only while actively dragging the iframe-width handle
             so text in toolbar / description / overview / foundations stays
             selectable (Ctrl+C, marking) during normal use. -->
        <!-- `min-w-0` lets <main> shrink below the toolbar's intrinsic width — without it
             flex-1 defaults to min-width: auto = content size, so on ≤768 px viewports the
             toolbar's preset buttons + Rotate + Canvas overflow horizontally and get clipped
             by the parent overflow-hidden wrapper, making them unreachable. With min-w-0 the
             toolbar's own overflow-x-auto can kick in and the row becomes horizontally
             scrollable inside the chrome instead of disappearing. -->
        <main x-data="preview" class="flex-1 flex flex-col min-w-0 bg-white dark:bg-zinc-950" :class="isDragging && 'cursor-ew-resize select-none'">
            <!-- Toolbar. `shrink-0` on each direct child keeps individual buttons
                 from being squeezed unreadable. No horizontal overflow — the
                 viewport dropdown below xl keeps the row narrow enough to fit
                 even on ~720px screens, so the dropdown popover is free to
                 break out of the toolbar's flow without getting clipped. -->
            <div class="flex justify-between items-center gap-3 px-4 py-2.5 bg-zinc-50 border-b border-zinc-200 dark:bg-zinc-900 dark:border-zinc-800">
                <div class="flex items-center gap-3 min-w-0">
                    <button @click="$store.ui.toggleSidebar()" class="text-zinc-600 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 shrink-0" :title="$store.i18n.t('toolbar.toggle_sidebar')" :aria-label="$store.i18n.t('toolbar.toggle_sidebar')">
                        <svg aria-hidden="true" focusable="false" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <template x-if="$store.ui.route.type === 'overview'">
                        <span class="font-semibold text-zinc-900 dark:text-zinc-100" x-text="$store.i18n.t('nav.overview')"></span>
                    </template>
                    <template x-if="$store.ui.route.type === 'foundations'">
                        <span class="font-semibold text-zinc-900 dark:text-zinc-100" x-text="$store.i18n.t('nav.foundations')"></span>
                    </template>
                    <template x-if="$store.ui.route.slug">
                        <div class="flex items-center gap-2 min-w-0">
                            <span class="text-[10px] uppercase tracking-wider font-bold bg-indigo-100 text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-300 px-2 py-0.5 rounded shrink-0"
                                  x-text="$store.ui.route.type === 'page' ? $store.i18n.t('toolbar.type_page') : $store.i18n.t('toolbar.type_component')"></span>
                            <!-- Breadcrumb: Section / Component name (slug). The section
                                 segment hides while the components API is still loading
                                 so the toolbar doesn't flash a translated label like
                                 `(undefined)` before data arrives. -->
                            <nav class="flex items-center gap-1.5 min-w-0 text-sm">
                                <template x-if="currentSectionKey">
                                    <span class="text-zinc-500 shrink-0" x-text="$store.i18n.t(`sections.${currentSectionKey}`)"></span>
                                </template>
                                <template x-if="currentSectionKey">
                                    <span class="text-zinc-400 dark:text-zinc-600 shrink-0">/</span>
                                </template>
                                <span class="font-semibold text-zinc-900 dark:text-zinc-100 truncate" x-text="currentItemName"></span>
                                <span class="text-zinc-500 font-mono text-xs shrink-0" x-text="`(${$store.ui.route.slug})`"></span>
                            </nav>
                        </div>
                    </template>
                    <template x-if="!$store.ui.route.slug && $store.ui.route.type !== 'foundations' && $store.ui.route.type !== 'overview'">
                        <span class="text-zinc-500 text-sm" x-text="$store.i18n.t('toolbar.select_prompt')"></span>
                    </template>
                </div>

                <!-- Viewport controls — Tailwind-aligned segmented control with explicit
                     pixel labels + Custom number input + Full. Hidden on the foundations
                     route where responsive testing doesn't make sense (foundations shows
                     palette / typography / project surface; locking it to 100% width
                     keeps the layout stable across reloads). -->
                <template x-if="iframeSrc && $store.ui.route.type !== 'foundations' && $store.ui.route.type !== 'overview'">
                    <div class="flex items-center gap-3 shrink-0">
                        <!-- Live readout — shows W × H px when a preset is active (so the
                             editor sees both dimensions at a glance), or just W px when
                             Custom/Full (no canonical height). Tracks rotation: rotated
                             Mobile 375 × 667 reads as "667 × 375 px". -->
                        <span class="font-mono text-xs text-zinc-500 tabular-nums hidden sm:inline"
                              x-text="$store.ui.previewHeight ? `${parseInt($store.ui.displayWidth, 10) || currentWidth} × ${$store.ui.displayHeight} px` : `${currentWidth} px`"></span>
                        <!-- Segmented pill: full preset list visible on xl+ toolbars,
                             where the 10-button strip fits next to the breadcrumb without
                             overlap. Below xl the same controls collapse into the
                             dropdown below; both surfaces share `activePreset` + `setPreset`
                             so the active selection stays in sync regardless of viewport. -->
                        <div class="hidden xl:flex gap-px rounded overflow-hidden bg-zinc-200 dark:bg-zinc-800">
                            <template x-for="vp in viewports" :key="vp.key">
                                <button @click="setPreset(vp.key)"
                                        :title="vp.width ? `${vp.label} — ${vp.width} × ${vp.height} px` : `${vp.label} — 100%`"
                                        class="px-2 h-7 flex items-center justify-center gap-1 text-xs font-medium tabular-nums transition-colors"
                                        :class="activePreset === vp.key ? 'bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900' : 'text-zinc-600 hover:text-zinc-900 hover:bg-zinc-300 dark:text-zinc-400 dark:hover:text-zinc-100 dark:hover:bg-zinc-700'">
                                    <!-- Device-class icon: mobile = phone, tablet = tablet,
                                         desktop = monitor, full = stretch-arrows. Same icon
                                         glyphs across the three width steps in each class so
                                         the eye can scan-group quickly (Mobile S/M/L all
                                         carry the same phone icon — only the px number
                                         differs). -->
                                    <svg aria-hidden="true" focusable="false" class="w-3 h-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x-html="categoryIconPaths[vp.category]"></svg>
                                    <!-- Width number as label for the px-bearing presets;
                                         "Full" label for the 100% preset. -->
                                    <span x-text="vp.width ?? vp.label"></span>
                                </button>
                            </template>
                        </div>

                        <!-- Narrow-toolbar dropdown — visible below xl. Single trigger
                             button + click-anywhere-to-close popover that lists the same
                             10 presets as the segmented pill above. State is local to
                             this Alpine fragment because the open/close concern doesn't
                             belong on the global ui store. -->
                        <div class="xl:hidden relative" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="open = false">
                            <button type="button"
                                    @click="open = !open"
                                    :aria-expanded="open"
                                    :title="$store.i18n.t('toolbar.viewport_preset')"
                                    class="px-2 h-7 flex items-center gap-1.5 rounded text-xs font-medium tabular-nums transition-colors"
                                    :class="open ? 'bg-zinc-300 dark:bg-zinc-700 text-zinc-900 dark:text-zinc-100' : 'bg-zinc-200 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-200 hover:bg-zinc-300 dark:hover:bg-zinc-700'">
                                <!-- Active-preset icon (matches the pill's per-row icon
                                     for the SAME row that is currently selected). -->
                                <svg aria-hidden="true" focusable="false" class="w-3 h-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x-html="categoryIconPaths[activePresetCategory]"></svg>
                                <span x-text="activeLabel"></span>
                                <!-- Chevron-down. Rotates 180° when open as a tiny
                                     affordance that this is a dropdown, not a button. -->
                                <svg aria-hidden="true" focusable="false" class="w-3 h-3 shrink-0 transition-transform" :class="open && 'rotate-180'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"/>
                                </svg>
                            </button>
                            <div x-show="open"
                                 x-transition.opacity.duration.100ms
                                 class="absolute right-0 top-full mt-1 z-50 min-w-[180px] rounded shadow-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 py-1"
                                 style="display: none">
                                <template x-for="vp in viewports" :key="vp.key">
                                    <button @click="setPreset(vp.key); open = false"
                                            class="w-full px-3 py-1.5 flex items-center gap-2 text-xs tabular-nums transition-colors"
                                            :class="activePreset === vp.key ? 'bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900' : 'text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-700'">
                                        <svg aria-hidden="true" focusable="false" class="w-3 h-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x-html="categoryIconPaths[vp.category]"></svg>
                                        <span class="font-medium" x-text="vp.label"></span>
                                        <span class="ml-auto opacity-70" x-text="vp.width ? `${vp.width} × ${vp.height}` : '100%'"></span>
                                    </button>
                                </template>
                            </div>
                        </div>

                        <!-- Custom input — always visible alongside whichever preset surface
                             is active (segmented pill on xl+, dropdown trigger on smaller).
                             Typing then Enter / blur applies the value (validated
                             100..4000 px). When the store width matches a preset, the
                             input still shows the current pixel value so it's a readout +
                             override knob in one. activePreset === 'custom' flips the
                             styling to the selected state. -->
                        <input type="number"
                               x-model.number="customWidthInput"
                               @keydown.enter.prevent="applyCustomWidth(); $event.target.blur()"
                               @blur="applyCustomWidth"
                               :min="100" :max="4000"
                               :placeholder="$store.i18n.t('toolbar.custom_width_placeholder')"
                               :aria-label="$store.i18n.t('toolbar.custom_width')"
                               :title="$store.i18n.t('toolbar.custom_width')"
                               class="w-20 px-2 h-7 text-xs font-mono tabular-nums rounded focus:outline-none focus:ring-1 focus:ring-zinc-500 dark:focus:ring-zinc-400 transition-colors"
                               :class="activePreset === 'custom' ? 'bg-zinc-900 text-white placeholder-zinc-400 dark:bg-zinc-100 dark:text-zinc-900 dark:placeholder-zinc-500' : 'bg-zinc-200 text-zinc-600 placeholder-zinc-500 hover:bg-zinc-300 hover:text-zinc-900 dark:bg-zinc-800 dark:text-zinc-400 dark:placeholder-zinc-500 dark:hover:bg-zinc-700 dark:hover:text-zinc-100'">
                        <!-- Rotate button — swaps iframe width × height. Only enabled when
                             a device preset is active (Mobile / Tablet / Desktop) — Full and
                             Custom modes have no canonical orientation to rotate. Active
                             state when previewRotated is true so the editor sees they're in
                             landscape. -->
                        <button type="button"
                                @click="$store.ui.toggleRotation()"
                                :disabled="$store.ui.previewHeight === null"
                                :title="$store.i18n.t('toolbar.rotate')"
                                :aria-label="$store.i18n.t('toolbar.rotate')"
                                :aria-pressed="$store.ui.previewRotated ? 'true' : 'false'"
                                class="h-7 w-7 flex items-center justify-center rounded transition-colors disabled:opacity-30 disabled:cursor-not-allowed"
                                :class="$store.ui.previewRotated ? 'bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900' : 'text-zinc-600 hover:text-zinc-900 hover:bg-zinc-200 dark:text-zinc-400 dark:hover:text-zinc-100 dark:hover:bg-zinc-700'">
                            <!-- Rotate-device glyph: phone in portrait + curved arrow over
                                 it suggesting the swap to landscape. -->
                            <svg aria-hidden="true" focusable="false" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="7" y="3" width="10" height="14" rx="2"/>
                                <path d="M16 19h2a3 3 0 0 0 3-3v-2"/>
                                <polyline points="18 17 21 14 24 17" transform="translate(-3 0)"/>
                            </svg>
                        </button>
                        <!-- Canvas mode — drops the iframe and navigates the parent
                             window in-place to /render/<kind>/<slug>?canvas=1.
                             In that view viewport units (vh / svh / dvh / h-screen)
                             resolve against the real browser viewport, which fixes
                             the device-emulation paradox documented in
                             github.com/parisek/styleguide/issues/14 .
                             The `?canvas=1` flag tells render-cell.twig to suppress
                             its sticky back-bar — the bar would otherwise eat ~40px
                             at the top of the viewport, defeating the "100% viewport"
                             promise (h-svh content pushed off-screen). The browser
                             back button remains the return path; the URL bar stays
                             visible in canvas mode so navigation is still possible. -->
                        <button type="button"
                                @click="$store.ui.route.slug && (window.location.href = iframeSrc + (iframeSrc.includes('?') ? '&' : '?') + 'canvas=1')"
                                :title="$store.i18n.t('toolbar.canvas_mode')"
                                class="px-2.5 h-7 flex items-center justify-center rounded text-xs font-medium text-zinc-600 hover:text-zinc-900 hover:bg-zinc-200 dark:text-zinc-400 dark:hover:text-zinc-100 dark:hover:bg-zinc-700 transition-colors">
                            <span x-text="$store.i18n.t('toolbar.canvas_mode_label')"></span>
                        </button>
                        <!-- Open the raw render endpoint in a new tab. No `?canvas=1`
                             flag here — render-cell.twig's standalone back-bar IS
                             welcome in this flow (separate tab = no iframe parent to
                             return to via browser back), so the user gets a visible
                             "← back to styleguide" link at the top of the new tab. -->
                        <a :href="iframeSrc" target="_blank" rel="noopener"
                           :title="$store.i18n.t('toolbar.open_in_new_tab')"
                           :aria-label="$store.i18n.t('toolbar.open_in_new_tab')"
                           class="h-7 w-7 flex items-center justify-center rounded text-zinc-600 hover:text-zinc-900 hover:bg-zinc-200 dark:text-zinc-400 dark:hover:text-zinc-100 dark:hover:bg-zinc-700 transition-colors">
                            <svg aria-hidden="true" focusable="false" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 4h6v6M20 4l-9 9M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/>
                            </svg>
                        </a>
                    </div>
                </template>
                <!-- Foundations route still gets the open-in-new-tab affordance,
                     just without the viewport controls. -->
                <template x-if="iframeSrc && $store.ui.route.type === 'foundations'">
                    <a :href="iframeSrc" target="_blank" rel="noopener"
                       :title="$store.i18n.t('toolbar.open_in_new_tab')"
                       :aria-label="$store.i18n.t('toolbar.open_in_new_tab')"
                       class="h-7 w-7 flex items-center justify-center rounded text-zinc-600 hover:text-zinc-900 hover:bg-zinc-200 dark:text-zinc-400 dark:hover:text-zinc-100 dark:hover:bg-zinc-700 transition-colors shrink-0">
                        <svg aria-hidden="true" focusable="false" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 4h6v6M20 4l-9 9M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/>
                        </svg>
                    </a>
                </template>
            </div>

            <!-- Description bar — surfaces the component / page `description`
                 from its YAML metadata in a subtle line between the toolbar
                 and the usage panel. Hidden when description is empty or the
                 route doesn't carry a slug (meta routes don't have one).
                 Renders via x-html so authors can embed real anchor tags
                 (SEO-grade, crawlable) — content originates in
                 dev-authored .twig YAML headers, not user input, so the
                 trust model matches the rest of the styleguide chrome. -->
            <template x-if="currentItemDescription && $store.ui.route.slug">
                <div class="sg-description-bar px-4 py-2 bg-zinc-100/60 border-b border-zinc-200 dark:bg-zinc-900/40 dark:border-zinc-800 text-xs text-zinc-600 dark:text-zinc-400 leading-relaxed">
                    <span x-html="currentItemDescription"></span>
                </div>
            </template>

            <!-- Usage cross-reference panel — what this component is used in, or which components a page uses -->
            <div x-data="usagePanel" x-show="visible && items.length" class="px-4 py-2 bg-zinc-100/80 border-b border-zinc-200 dark:bg-zinc-900/60 dark:border-zinc-800 flex items-center gap-2 flex-wrap text-xs">
                <span class="uppercase tracking-wider font-semibold text-zinc-500 shrink-0" x-text="label"></span>
                <template x-for="item in items" :key="`${item.type}:${item.id}`">
                    <button @click="select(item)"
                            :disabled="!item.type"
                            :title="item.type ? `${item.type}/${item.id}` : item.id"
                            class="px-2 py-0.5 rounded font-mono transition-colors"
                            :class="item.type
                                ? (item.type === 'page'
                                    ? 'bg-indigo-100 text-indigo-700 hover:bg-indigo-200 dark:bg-indigo-500/10 dark:text-indigo-300 dark:hover:bg-indigo-500/20'
                                    : 'bg-zinc-200 text-zinc-700 hover:bg-zinc-300 hover:text-zinc-900 dark:bg-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-700 dark:hover:text-white')
                                : 'bg-zinc-200/60 text-zinc-400 dark:bg-zinc-800/40 dark:text-zinc-600 cursor-not-allowed line-through'">
                        <span x-text="item.name"></span>
                    </button>
                </template>
            </div>

            <!-- External-link bar — Asana / Figma / Drupal / Web icons fed from
                 the current component's parsed metadata (`asana:`, `figma:`,
                 `drupal:`, `web:` keys in the .twig YAML comment). Hidden when
                 no links are declared. -->
            <div x-data="linkBar" x-show="visible && links.length" class="px-4 py-2 bg-zinc-100/60 border-b border-zinc-200 dark:bg-zinc-900/40 dark:border-zinc-800 flex items-center gap-2 flex-wrap text-xs">
                <template x-for="link in links" :key="link.key">
                    <a :href="link.url" target="_blank" rel="noopener"
                       :title="`${link.label} — ${link.url}`"
                       class="inline-flex items-center gap-1.5 px-2 py-1 rounded bg-zinc-200/80 text-zinc-700 hover:bg-zinc-300 hover:text-zinc-900 dark:bg-zinc-800/60 dark:text-zinc-300 dark:hover:bg-zinc-700 dark:hover:text-white transition-colors">
                        <template x-if="link.key === 'asana'">
                            <svg aria-hidden="true" focusable="false" class="w-3.5 h-3.5 text-rose-500 dark:text-rose-400" viewBox="0 0 24 24" fill="currentColor"><path d="M18.78 12.653c-2.478 0-4.487 2.009-4.487 4.487 0 2.478 2.009 4.487 4.487 4.487 2.478 0 4.487-2.009 4.487-4.487 0-2.478-2.009-4.487-4.487-4.487zm-13.56 0c-2.478 0-4.487 2.009-4.487 4.487 0 2.478 2.009 4.487 4.487 4.487 2.478 0 4.487-2.009 4.487-4.487 0-2.478-2.009-4.487-4.487-4.487zm11.267-5.14c0 2.478-2.009 4.487-4.487 4.487-2.478 0-4.487-2.009-4.487-4.487 0-2.478 2.009-4.487 4.487-4.487 2.478 0 4.487 2.009 4.487 4.487"/></svg>
                        </template>
                        <template x-if="link.key === 'figma'">
                            <svg aria-hidden="true" focusable="false" class="w-3.5 h-3.5" viewBox="0 0 15 22" fill="none"><path d="M7.5 11a3.75 3.75 0 1 1 7.5 0 3.75 3.75 0 0 1-7.5 0z" fill="#1ABCFE"/><path d="M0 18.25a3.75 3.75 0 0 1 3.75-3.75H7.5V22a3.75 3.75 0 1 1-7.5 0v-3.75z" fill="#0ACF83"/><path d="M7.5 0v7.5h3.75a3.75 3.75 0 1 0 0-7.5H7.5z" fill="#FF7262"/><path d="M0 3.75A3.75 3.75 0 0 0 3.75 7.5H7.5V0H3.75A3.75 3.75 0 0 0 0 3.75z" fill="#F24E1E"/><path d="M0 11a3.75 3.75 0 0 0 3.75 3.75H7.5V7.5H3.75A3.75 3.75 0 0 0 0 11z" fill="#A259FF"/></svg>
                        </template>
                        <template x-if="link.key === 'drupal'">
                            <svg aria-hidden="true" focusable="false" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="#0678be"><path d="M12 0C10.736 3.256 8.928 4.976 6.624 7.28 3.456 10.448 2 13.12 2 16.064 2 20.448 6.464 24 12 24s10-3.552 10-7.936c0-2.944-1.456-5.616-4.624-8.784C15.072 4.976 13.264 3.256 12 0z"/></svg>
                        </template>
                        <template x-if="link.key === 'web'">
                            <svg aria-hidden="true" focusable="false" class="w-3.5 h-3.5 text-zinc-500 dark:text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                        </template>
                        <span x-text="link.label"></span>
                    </a>
                </template>
            </div>

            <!-- Per-component Fields drawer — collapsible, SPA-rendered (NOT
                 in the iframe) so the metadata table looks identical across
                 every consuming project regardless of their own CSS. Shows
                 only when the current route's component / page actually
                 declares a `fields:` block in its YAML metadata. Default
                 collapsed; tree depth comes from flattenFieldsTree() so
                 the template stays linear. -->
            <template x-if="currentItemFieldsCount > 0 && $store.ui.route.slug">
                <div x-data="{ open: false }" class="border-b border-zinc-200 bg-zinc-100/60 dark:border-zinc-800 dark:bg-zinc-900/40">
                    <button @click="open = !open"
                            class="w-full flex items-center gap-2 px-4 py-2 text-xs text-zinc-600 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 transition-colors">
                        <svg aria-hidden="true" focusable="false" class="w-3 h-3 transition-transform" :class="open && 'rotate-90'" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                        <span class="uppercase tracking-wider font-semibold" x-text="$store.i18n.t('nav.fields')"></span>
                        <span class="font-mono text-zinc-500" x-text="currentItemFieldsCount"></span>
                    </button>
                    <div x-show="open" x-collapse class="bg-white/60 dark:bg-zinc-950/40">
                        <div class="max-h-80 overflow-y-auto">
                            <table class="w-full text-xs">
                                <thead class="sticky top-0 bg-zinc-100 dark:bg-zinc-900 text-left text-[10px] uppercase tracking-wider text-zinc-500">
                                    <tr class="border-b border-zinc-200 dark:border-zinc-800">
                                        <th class="px-4 py-2 font-medium w-56">Field</th>
                                        <th class="px-4 py-2 font-medium w-28">Type</th>
                                        <th class="px-4 py-2 font-medium w-40">Title</th>
                                        <th class="px-4 py-2 font-medium">Description</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-zinc-200 dark:divide-zinc-800/60">
                                    <template x-for="row in currentItemFieldsTree" :key="row.path">
                                        <tr class="hover:bg-zinc-100 dark:hover:bg-zinc-800/40 transition-colors">
                                            <td class="px-4 py-2 align-middle">
                                                <!-- Tailwind utility classes can't take a runtime depth value;
                                                     inline padding-left is the cleanest path. -->
                                                <span class="inline-flex items-center gap-2"
                                                      :style="`padding-left: ${row.depth * 1.5}rem`">
                                                    <template x-if="row.depth > 0">
                                                        <span class="text-zinc-400 dark:text-zinc-600 font-mono text-base leading-none -mt-1" aria-hidden="true">└</span>
                                                    </template>
                                                    <span class="font-mono text-zinc-800 bg-zinc-200 dark:text-zinc-100 dark:bg-zinc-800 px-1.5 py-0.5 rounded text-xs"
                                                          x-text="row.key"></span>
                                                    <template x-if="row.required">
                                                        <span class="w-2 h-2 rounded-full bg-red-500 shrink-0"
                                                              role="img"
                                                              :title="$store.i18n.t('fields.required')"
                                                              :aria-label="$store.i18n.t('fields.required')"></span>
                                                    </template>
                                                </span>
                                            </td>
                                            <td class="px-4 py-2 align-middle">
                                                <template x-if="row.type">
                                                    <span class="inline-flex items-center px-2 py-0.5 rounded font-mono text-[10px] tracking-wider uppercase font-semibold"
                                                          :class="fieldsTypePill(row.type)"
                                                          x-text="row.type"></span>
                                                </template>
                                                <template x-if="!row.type">
                                                    <span class="text-zinc-400 dark:text-zinc-600">—</span>
                                                </template>
                                            </td>
                                            <td class="px-4 py-2 align-middle text-zinc-700 dark:text-zinc-300" x-text="row.title || '—'"></td>
                                            <td class="px-4 py-2 align-middle text-zinc-500 leading-relaxed" x-html="row.description || '—'"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                            <div class="px-4 py-2 border-t border-zinc-200 bg-zinc-100/80 dark:border-zinc-800 dark:bg-zinc-900/60 text-[10px] text-zinc-500 flex items-center gap-2">
                                <!-- Decorative: the localised legend text right next
                                     to it already conveys meaning to screen readers. -->
                                <span class="w-2 h-2 rounded-full bg-red-500 inline-block" aria-hidden="true"></span>
                                <span x-text="$store.i18n.t('fields.requiredLegend')"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Foundations: full-bleed iframe, no frame / shadow / dark
                 padding. Matches the Overview view's flat in-shell look so
                 the styleguide-meta pages (overview + foundations) share a
                 visual treatment distinct from the responsive-test surface
                 used for component / page previews. The wrapper stays
                 `bg-white` in both themes — it sits BEHIND the iframe and
                 shows through any transparent parts of the consumer's
                 foundations content, which is theme-agnostic from our
                 perspective. Painting it dark in dark mode would put the
                 consumer's light-rendered text on a dark backdrop. -->
            <template x-if="$store.ui.route.type === 'foundations'">
                <div class="flex-1 relative bg-white overflow-hidden">
                    <iframe :src="iframeSrc" @load="onIframeLoad"
                            class="w-full h-full border-0"></iframe>
                    <div x-show="isLoading"
                         class="absolute inset-0 flex items-center justify-center bg-white pointer-events-none">
                        <div x-show="isLoading"
                             x-transition.opacity.duration.150ms.delay.120ms
                             class="w-2 h-2 rounded-full bg-zinc-300 animate-pulse"></div>
                    </div>
                </div>
            </template>

            <!-- Component / page: framed iframe inside dark padding, drag
                 handles + viewport controls active. Hidden for the meta
                 routes (overview + foundations) which render in their own
                 templates above and below. -->
            <template x-if="$store.ui.route.type !== 'overview' && $store.ui.route.type !== 'foundations'">
            <!-- `items-stretch` in Full preset lets the wrapper's height: 100%
                 resolve against this flex parent's intrinsic height (which
                 itself fills the chrome's right pane via `flex-1`). For
                 non-Full presets we use `items-center` so the scaled device
                 sits visually centred in the canvas — matches how a device
                 lying on a desk reads, and uses the extra vertical room a
                 wide preset (2K, etc.) leaves after fit-to-bounds zoom. -->
            <div class="flex-1 flex justify-center overflow-auto"
                 :class="isFullPreset ? 'p-0 bg-white dark:bg-zinc-900 items-stretch' : 'p-6 bg-zinc-100 dark:bg-zinc-950 items-center'">
                <template x-if="iframeSrc">
                    <!-- Outer positioning ancestor — sized to the inner wrapper via
                         inline-block, so it inherits the scaled device dimensions.
                         Hosts the chassis decorations (speaker slot, home indicator)
                         and drag handles as absolute-positioned siblings of the
                         iframe-bearing wrapper. The iframe wrapper itself keeps
                         overflow-hidden (needed to clip iframe corners against the
                         rounded chassis); putting decorations here lets them sit on
                         the ring area without being clipped. -->
                    <!-- For preset/Custom modes the ancestor is `inline-block` so chassis
                         pills (speaker slot, camera dot, home indicator) can sit on
                         the ring as absolute-positioned siblings of the wrapper
                         without being clipped by the wrapper's `overflow-hidden`.
                         Full mode is the exception: the wrapper wants `width: 100%;
                         height: 100%` against the chrome pane, but `inline-block`
                         collapses to the iframe's intrinsic UA width (~300px), so
                         percentage widths resolved against a 300px ancestor — not
                         the chrome pane. For Full we promote to a `block` element
                         that stretches via the flex parent's `items-stretch`. -->
                    <div class="relative" :class="isFullPreset ? 'block w-full h-full' : 'inline-block'">
                        <!-- Mobile chassis: speaker slot top + home indicator bottom.
                             Positioned to sit on the 10px ring (top/bottom -7px puts
                             the pill roughly centered on the chassis bezel). Colors
                             read against ring-zinc-800/ring-zinc-700 in both themes. -->
                        <template x-if="activePresetCategory === 'mobile'">
                            <div class="pointer-events-none">
                                <div class="absolute left-1/2 -translate-x-1/2 -top-[7px] h-1 w-12 rounded-full bg-zinc-600 dark:bg-zinc-500"></div>
                                <div class="absolute left-1/2 -translate-x-1/2 -bottom-[7px] h-1 w-20 rounded-full bg-zinc-500 dark:bg-zinc-400"></div>
                            </div>
                        </template>
                        <!-- Tablet chassis: lone camera dot. The 6px ring is too thin
                             for a speaker pill — a centered dot reads as "tablet". -->
                        <template x-if="activePresetCategory === 'tablet'">
                            <div class="pointer-events-none absolute left-1/2 -translate-x-1/2 -top-[5px] h-1 w-1 rounded-full bg-zinc-600 dark:bg-zinc-400"></div>
                        </template>

                        <!-- The wrapper bg stays white in both themes — iframe content
                             is the consumer's domain (no theme propagation), and they
                             render against an assumed light backdrop. A dark wrapper
                             would bleed through transparent iframe areas.

                             Device frame: `activePresetCategory` drives the bezel look.
                             Mobile presets get a chunky phone-style bezel (rounded-3xl
                             + thick ring); tablet gets a softer bezel; desktop gets a
                             monitor-bezel; Full/foundations skip the frame so the
                             preview reads edge-to-edge. Ring color shifts in dark mode
                             so the chassis still contrasts against dark:bg-zinc-950
                             (zinc-800 there would visually dissolve). -->
                        <div x-ref="iframeWrapper"
                             :style="wrapperStyle"
                             :class="[
                                 isDragging ? '' : 'transition-[width,height,border-radius] duration-200 ease-out',
                                 activePresetCategory === 'mobile' ? 'rounded-[2.5rem] ring-[10px] ring-zinc-800 dark:ring-zinc-700 shadow-2xl' : '',
                                 activePresetCategory === 'tablet' ? 'rounded-2xl ring-[6px] ring-zinc-800 dark:ring-zinc-700 shadow-xl' : '',
                                 activePresetCategory === 'desktop' ? 'rounded-lg ring-2 ring-zinc-300 dark:ring-zinc-700 shadow-xl' : '',
