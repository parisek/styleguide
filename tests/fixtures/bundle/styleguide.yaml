# The host application's project styleguide.yaml, as the Symfony bundle reads
# it. Paths are relative to this file, which is what fromYaml() resolves
# against — so the bundle's `config:` key is the only path a host has to give.
bootstrap:
  templates_path: ../templates
  static_path: ..
  default_locale: en
project:
  name: Bundle Fixture
  slug: bundle-fixture
iframe:
  # A root-relative path, the shape README documents: it is rebased onto
  # `twig_context.templateUrl` so one short value works in every layout. The
  # bundle has to supply that base from the request, which is what
  # `the_asset_base_comes_from_the_request` asserts.
  css: /dist/css/style.css
  js: ''
