project:
  name: Styleguide Fixture
  slug: styleguide-fixture
  description: Fixture project that the package's own e2e smoke tests render against
  locale: cs_CZ
  body_classes: ''
  favicon: /images/favicon.svg

# The render iframe injects these into its <head>. They don't need to resolve for
# the smoke tests (assertions check the emitted path strings + DOM, not asset
# loading), so a fixture project that ships no compiled CSS/JS is fine.
# body_class here is deliberately non-empty (unlike the other blank fixture
# defaults above) so smoke-http.sh can assert the consumer's site-wide class
# reaches component/page <body> but is skipped for foundations/doc — see
# "render doc skips the consumer's global body_class" below.
iframe:
  css: /dist/css/style.css
  js: /dist/js/script.js
  fonts: []
  html_class: ''
  body_class: 'bg-consumer-global'
  base_href: /

logo:
  main:
    src: /images/logo.svg
    alt: Logo
    # Hostile label (#78) — must reach the markup HTML-escaped, never raw.
    label: 'Logo<script>alert(1)</script>'
    background: light
  favicon:

# Hostile typography fixture (#78) — exercises the logo/typography sections
# that PR #77 left un-escaped (autoescape is off in the package's own Twig
# scope). Every consumer-controlled string here carries an XSS-shaped payload
# so smoke-http.sh can assert it's neutralised.
typography:
  fonts:
    - name: 'Evil<img src=x onerror=alert(1)>Font'
      type: Display
      url: 'https://example.com/font.css?v=1"onmouseover=alert(2)'
      usage: ['Headings<script>alert(3)</script>']
      alphabet: 'ABCDEFGabcdefg 0123456789'
  headings:
    - tag: h1
      size: text-4xl
      # No digits in the payload — heading.label is piped through |typography,
      # whose default number-wrap setting would split e.g. "alert(4)" into
      # "alert(<span class=…>4</span>)" and make a substring assertion brittle.
      label: 'Heading<script>alert(x)</script>'
      desc: '36px / 700'
  weights:
    - name: 'Bold<script>alert(5)</script>'
      class: font-bold
      value: '700'
  # Hostile suffix (#78) — body_sample is piped through |e|typography like
  # heading.label above, but had no regression coverage of its own. Legitimate
  # text is kept intact so NBSP/widow-prevention behavior on the plain
  # sentence stays covered by the same fixture value.
  body_sample: 'The quick brown fox jumps over the lazy dog. <img src=x onerror=alert(2)>End'

# Both palette shapes the overview normalizer accepts — the e2e smoke
# asserts foundations renders them side by side.
colors:
  primary:
    name: Primary
    css_variable: primary
    default: 500
    shades:
      100: { hex: '#FEDBDA', oklch: 'oklch(92.33% 0.039 19.83)' }
      500: { hex: '#FE4942', oklch: 'oklch(66.78% 0.219 27.17)' }
      900: { hex: '#410200', oklch: 'oklch(24.04% 0.095 30.36)' }
  brand:
    name: Brand (flat)
    swatches:
      - { name: red, hex: '#E63946', css_variable: brand-red }
      - { name: cream, hex: '#F1FAEE' }
      - { name: navy, hex: '#1D3557' }
      - { name: "robin's egg", hex: '#9EDDDF' }
      - { name: '<b>evil"name</b>', hex: '#AABBCC' }

labels:
  {
    colors: "Colors",
    click_to_copy: "Click to copy",
    copied: "Copied!",
    click_swatch: "Click a swatch",
    logo: "Logo",
    # Hostile label (#78) — labels.* outside #colors were previously unescaped.
    typography: 'Typography<script>alert(6)</script>',
  }
