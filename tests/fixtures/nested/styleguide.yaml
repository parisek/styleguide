project:
  # Hostile suffix (#78) — project.name/description reach foundations.twig's
  # header (`{{ styleguide.project.name|e }}` / `…description|e`) unescaped
  # before this sweep. The literal value is also asserted verbatim by
  # tests/SpaConfigTest.php (SPA #sg-config JSON injection, a separate code
  # path) — that suite's assertSame() calls were updated alongside this value.
  name: 'Styleguide Fixture<img src=x onerror=alert(7)>'
  slug: styleguide-fixture
  description: "Fixture project<script>alert(8)</script> that the package's own e2e smoke tests render against"
  locale: cs_CZ
  body_classes: ''
  favicon: /images/favicon.svg

# The render iframe injects these into its <head>. They don't need to resolve for
# the smoke tests (assertions check the emitted path strings + DOM, not asset
# loading), so a fixture project that ships no compiled CSS/JS is fine.
# body_class here is deliberately non-empty (unlike the other blank fixture
# defaults above) so smoke-http.sh can assert the consumer's site-wide class
# reaches component/page <body> but is skipped for foundations/doc — see
# "render doc skips the consumer's global body_class" below.
iframe:
  css: /dist/css/style.css
  js: /dist/js/script.js
  fonts: []
  html_class: ''
  body_class: 'bg-consumer-global'
  base_href: /

logo:
  main:
    # Hostile src/alt/size (#78) — all three are attribute contexts
    # (`src="…"` / `alt="…"` / the `<img>` class list), piped through
    # `|e('html_attr')` in foundations.twig. Payloads carry an unescaped
    # double quote to prove they can't break out of the attribute.
    src: '/images/logo.svg" onerror="alert(9)'
    alt: 'Logo" onerror="alert(10)'
    size: 'w-full max-w-48 h-auto" onerror="alert(11)'
    # Hostile label (#78) — must reach the markup HTML-escaped, never raw.
    label: 'Logo<script>alert(1)</script>'
    background: light
  favicon:

# Hostile typography fixture (#78) — exercises the logo/typography sections
# that PR #77 left un-escaped (autoescape is off in the package's own Twig
# scope). Every consumer-controlled string here carries an XSS-shaped payload
# so smoke-http.sh can assert it's neutralised.
typography:
  fonts:
    - name: 'Evil<img src=x onerror=alert(1)>Font'
      # Hostile type/alphabet (#78) — both are plain text-node `|e` contexts
      # (not piped through |typography), so digits in the payload are safe.
      type: 'Display<script>alert(12)</script>'
      url: 'https://example.com/font.css?v=1"onmouseover=alert(2)'
      usage: ['Headings<script>alert(3)</script>']
      alphabet: 'ABCDEFGabcdefg 0123456789<script>alert(13)</script>'
  headings:
    - # Hostile tag/size/desc (#78). tag/desc are plain text-node `|e`; size is
      # an attribute context (`|e('html_attr')`, the heading's class list) so
      # its payload carries an unescaped double quote to prove no breakout.
      tag: 'h1<script>alert(14)</script>'
      size: 'text-4xl" onerror="alert(15)'
      # No digits in the payload — heading.label is piped through |typography,
      # whose default number-wrap setting would split e.g. "alert(4)" into
      # "alert(<span class=…>4</span>)" and make a substring assertion brittle.
      label: 'Heading<script>alert(x)</script>'
      desc: '36px / 700<script>alert(16)</script>'
  weights:
    - name: 'Bold<script>alert(5)</script>'
      # Hostile class/value (#78) — class is an attribute context
      # (`|e('html_attr')`); value is a plain text-node `|e`.
      class: 'font-bold" onerror="alert(17)'
      value: '700<script>alert(18)</script>'
  # Hostile suffix (#78) — body_sample is piped through |e|typography like
  # heading.label above, but had no regression coverage of its own. Legitimate
  # text is kept intact so NBSP/widow-prevention behavior on the plain
  # sentence stays covered by the same fixture value.
  body_sample: 'The quick brown fox jumps over the lazy dog. <img src=x onerror=alert(2)>End'

# Both palette shapes the overview normalizer accepts — the e2e smoke
# asserts foundations renders them side by side.
colors:
  primary:
    name: Primary
    css_variable: primary
    default: 500
    shades:
      100: { hex: '#FEDBDA', oklch: 'oklch(92.33% 0.039 19.83)' }
      500: { hex: '#FE4942', oklch: 'oklch(66.78% 0.219 27.17)' }
      900: { hex: '#410200', oklch: 'oklch(24.04% 0.095 30.36)' }
  brand:
    name: Brand (flat)
    swatches:
      - { name: red, hex: '#E63946', css_variable: brand-red }
      - { name: cream, hex: '#F1FAEE' }
      - { name: navy, hex: '#1D3557' }
      - { name: "robin's egg", hex: '#9EDDDF' }
      - { name: '<b>evil"name</b>', hex: '#AABBCC' }

# Favicon audit fixture (#73) — mirrors FaviconAuditTest's happyPathConfig()
# 1:1 so the e2e render exercises the exact same entries/status/note shapes
# the unit suite already pins: png_96 ok (96×96), apple_touch WARNING
# (declares 180×180, fixture asset is really 120×120), manifest with one
# existing 192 maskable icon + one declared-but-missing-on-disk 512 icon.
favicon:
  svg: /images/touch/favicon.svg
  png_96: /images/touch/favicon-96x96.png
  ico: /images/touch/favicon.ico
  apple_touch: /images/touch/apple-touch-icon.png
  manifest: /images/touch/site.webmanifest
  theme_color: '#18181B'

# Open Graph image audit fixture (#74) — mirrors OgImageAuditTest's fixed
# fixture asset (tests/fixtures/images/og-image.png, a real 1200×630 PNG)
# so the e2e render exercises the exact same status/notes shape the unit
# suite already pins: configured, exists, 1200×630, status ok, no notes.
og_image: /images/og-image.png

labels:
  {
    colors: "Colors",
    click_to_copy: "Click to copy",
    copied: "Copied!",
    click_swatch: "Click a swatch",
    logo: "Logo",
    # Hostile label (#78) — labels.* outside #colors were previously unescaped.
    typography: 'Typography<script>alert(6)</script>',
  }
